<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KritiQuestionI - Versão 2.0 Ipiranga Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
</head>
<body>
  <div class="aurora aurora--one"></div>
  <div class="aurora aurora--two"></div>
  <div class="noise"></div>

  <main class="shell">
    <section class="card" aria-label="KritiQuestionI Version 2.0 Ipiranga Update">
      <header class="brand">
        <div class="brand__meta">
          <span class="brand__chip">Official Update</span>
          <span class="brand__chip brand__chip--soft">Memory sync active</span>
        </div>
        <img src="KritiquestionI.png" alt="KritiQuestionI" class="brand__logo">
      </header>

      <div class="progress" aria-hidden="true">
        <div class="progress__fill" id="progressFill"></div>
      </div>

      <section id="screen" class="screen screen--enter" aria-live="polite"></section>

      <footer class="footer">
        <p>Developed by Kauan Technologies®</p>
        <p>Versão 2.0 — Ipiranga Update</p>
      </footer>
    </section>
  </main>

  <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
  <script src="script.js" defer></script>
</body>
</html>
